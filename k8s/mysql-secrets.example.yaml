# Copiar a mysql-secrets.yaml (que NO se commitea, ver .gitignore) y llenar con
# valores reales. Este archivo de ejemplo sí se commitea para que alguien
# clonando el repo desde cero sepa qué forma debe tener.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
type: Opaque
stringData:
  # DSN completo esperado por golang-migrate y por hsm-service.
  # Formato: mysql://usuario:password@tcp(host:puerto)/nombre_db?parametros
  connection_string: "mysql://REPLACE_USER:REPLACE_PASSWORD@tcp(REPLACE_HOST:3306)/digsigna?tls=true"
