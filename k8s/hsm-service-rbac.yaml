apiVersion: v1
kind: ServiceAccount
metadata:
  name: hsm-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hsm-service-secrets-reader
rules:
- apiGroups: [ "" ]
  resources: [ "secrets" ]
  resourceNames: [ "hsm-secrets", "mysql-secrets" ]
  verbs: [ "get", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hsm-service-secrets-reader
subjects:
- kind: ServiceAccount
  name: hsm-service
roleRef:
  kind: Role
  name: hsm-service-secrets-reader
  apiGroup: rbac.authorization.k8s.io
