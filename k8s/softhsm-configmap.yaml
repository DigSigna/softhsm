apiVersion: v1
kind: ConfigMap
metadata:
  name: softhsm-config
data:
  softhsm2.conf: |
    directories.tokendir = /var/lib/softhsm/tokens
    objectstore.backend = file
    log.level = INFO
    # Configuración optimizada para contenedores
    slot.list.oneshot = false
    library.allow_export = true
