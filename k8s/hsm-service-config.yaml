apiVersion: v1
kind: ConfigMap
metadata:
  name: hsm-service-config
data:
  config.yaml: |
    server:
      port: 8080
    hsm:
      library_path: "/usr/lib/softhsm/libsofthsm2.so"
      token_label: "digsigna-token"
      pin: "1234"
      slot: 0
      no_slots: 4
      max_sessions: 5
      session_timeout: "30s"
    database:
      enabled: true
    auth:
      mode: "development"
      public_key_path: "/etc/hsm/certs/public.pem"
      jwks_url: "http://localhost:8080/.well-known/jwks.json"
      jwks_cache_minutes: 60
    audit:
      enabled: true
      strategy: "hybrid"
      http:
        timeout: "5s"
      hybrid:
        circuit_breaker:
          max_failures: 5
          reset_timeout: "30s"
    aeskeymanager:
      strategy: "k8s"
      k8s:
        secret_name: "hsm-secrets"
        master_key_key: "master-key"
        old_master_key_key: "master-key-old"
        key_id: "master-aes-key-v1"
        in_cluster: true
    logging:
      level: "debug"
