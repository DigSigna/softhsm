apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hsm-service
  template:
    metadata:
      labels:
        app: hsm-service
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      securityContext:
        fsGroup: 1000

      volumes:
      - name: hsm-tokens
        persistentVolumeClaim:
          claimName: softhsm-pvc

      - name: softhsm-config
        configMap:
          name: softhsm-config

      - name: hsm-service-config
        configMap:
          name: hsm-service-config
      # -------------------------------------------------
      # INIT CONTAINER: Descargar certificados CA
      # -------------------------------------------------
      initContainers:
      - name: softhsm-init
        image: ghcr.io/digsigna/softhsm/softhsm:latest
        command: [ "/bin/sh", "-c", "/usr/local/bin/init-token-if-empty.sh" ]
        env:
        - name: TOKEN_LABEL
          value: "digsigna-token"
        - name: USER_PIN
          valueFrom:
            secretKeyRef:
              name: hsm-secrets
              key: pin
        - name: SO_PIN
          valueFrom:
            secretKeyRef:
              name: hsm-secrets
              key: so-pin
        volumeMounts:
        - name: hsm-tokens
          mountPath: /var/lib/softhsm/tokens
        - name: softhsm-config
          mountPath: /etc/softhsm2.conf
          subPath: softhsm2.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      containers:
      # -------------------------------------------------
      # MAIN APP (Go)
      # -------------------------------------------------
      - name: hsm-service
        image: ghcr.io/digsigna/hsm-service:latest
        imagePullPolicy: Always
        env:
        - name: DATABASE_ENABLED
          value: "true"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: connection_string

        - name: HSM_ENVIRONMENT
          value: "production"

        - name: HSM_LIBRARY_PATH
          value: "/usr/lib/softhsm/libsofthsm2.so"

        - name: HSM_TOKEN_LABEL
          value: "digsigna-token"

        - name: HSM_PIN
          valueFrom:
            secretKeyRef:
              name: hsm-secrets
              key: pin

        volumeMounts:
        - name: hsm-tokens
          mountPath: /var/lib/softhsm/tokens
        - name: softhsm-config
          mountPath: /etc/softhsm2.conf
          subPath: softhsm2.conf
        - name: hsm-service-config
          mountPath: /root/config/config.yaml
          subPath: config.yaml

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # -------------------------------------------------
      # SIDECAR (espera y nada más)
      # -------------------------------------------------
      - name: softhsm-sidecar
        image: ghcr.io/digsigna/softhsm/softhsm:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: hsm-tokens
          mountPath: /var/lib/softhsm/tokens
        - name: softhsm-config
          mountPath: /etc/softhsm2.conf
          subPath: softhsm2.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
