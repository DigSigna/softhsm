name: Build and Push SoftHSM Sidecar to GHCR

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Log in to GHCR
      run: echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build and push image
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_BASE="ghcr.io/${OWNER}/softhsm/softhsm"

        # Build with :latest tag
        docker build -t $IMAGE_BASE:latest -f Dockerfile .
        docker push $IMAGE_BASE:latest

        # If this is a version tag, also tag with version
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          docker tag $IMAGE_BASE:latest $IMAGE_BASE:$VERSION
          docker push $IMAGE_BASE:$VERSION
        fi